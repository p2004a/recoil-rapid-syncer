name: ci
on: [push, pull_request]
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '^1.25.0'
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./... -v
      - name: Format
        run: gofmt -d . && [ -z "$(gofmt -l .)" ]
